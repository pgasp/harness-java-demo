apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-java-demo
  namespace: harness-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harness-java-demo
  template:
    metadata:
      labels:
        app: harness-java-demo
    spec:
      containers:
        - name: harness-java-demo
          image: <+artifact.image>
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "200m"
