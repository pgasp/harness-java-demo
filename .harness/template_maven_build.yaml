template:
  name: Maven Build Step
  type: Stage
  projectIdentifier: default_project
  orgIdentifier: default
  spec:
    type: CI
    spec:
      cloneCodebase: true
      infrastructure:
        type: KubernetesDirect
        spec:
          connectorRef: k8slocal
          namespace: harness-delegate-ng
          automountServiceAccountToken: true
          nodeSelector: {}
          os: Linux
      execution:
        steps:
          - step:
              type: Run
              name: Maven Build and Test
              identifier: Maven_Build_and_Test
              spec:
                connectorRef: pgasp_docker_hub
                image: maven:3.9-eclipse-temurin-17
                command: mvn clean package
          - step:
              type: BuildAndPushDockerRegistry
              name: Push to DockerHub
              identifier: Push_to_DockerHub
              spec:
                connectorRef: pgasp_docker_hub
                repo: pgasp/harness-java-demo
                tags:
                  - latest
  identifier: Maven_Build_Step
  versionLabel: v1
