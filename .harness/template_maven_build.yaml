template:
  name: Maven Build Step
  type: Stage
  projectIdentifier: default_project
  orgIdentifier: default
  spec:
    type: CI
    spec:
      cloneCodebase: true
      infrastructure:
        type: KubernetesDirect
        spec:
          connectorRef: k8slocal
          namespace: harness-delegate-ng
          automountServiceAccountToken: true
          nodeSelector: {}
          os: Linux
      execution:
        steps:
          - step:
              type: Run
              name: Validate Base Image
              identifier: Validate_Base_Image
              spec:
                connectorRef: pgasp_docker_hub
                image: alpine:3.19
                command: |
                  APPROVED="eclipse-temurin:17 eclipse-temurin:17-jre-jammy eclipse-temurin:21 eclipse-temurin:21-jre-jammy"
                  FROM=$(grep -m1 '^FROM' Dockerfile | awk '{print $2}')
                  echo "Image détectée : $FROM"
                  if echo "$APPROVED" | grep -qw "$FROM"; then
                    echo "✅ Image approuvée"
                  else
                    echo "❌ Image non approuvée : $FROM"
                    echo "Images autorisées : $APPROVED"
                    exit 1
                  fi
          - step:
              type: Run
              name: Maven Build and Test
              identifier: Maven_Build_and_Test
              spec:
                connectorRef: pgasp_docker_hub
                image: maven:3.9-eclipse-temurin-17
                command: mvn clean package
          - step:
              type: BuildAndPushDockerRegistry
              name: Push to DockerHub
              identifier: Push_to_DockerHub
              spec:
                connectorRef: pgasp_docker_hub
                repo: pgasp/harness-java-demo
                tags:
                  - latest
          - step:
              type: Run
              name: Trivy Image Scan
              identifier: Trivy_Image_Scan
              spec:
                connectorRef: pgasp_docker_hub
                image: aquasec/trivy:latest
                command: |
                  trivy image \
                    --severity CRITICAL \
                    --exit-code 1 \
                    --no-progress \
                    pgasp/harness-java-demo:latest
  identifier: Maven_Build_Step
  versionLabel: v1
